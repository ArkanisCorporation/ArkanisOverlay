name: Deploy Aspire Kubernetes

permissions: {}

on:
  workflow_call:
    inputs:
      target:
        description: "Fixed Kubernetes deployment target: staging or production."
        required: true
        type: string
      image-tag:
        description: Immutable container image tag to deploy.
        required: true
        type: string

jobs:
  deploy-staging:
    if: ${{ inputs.target == 'staging' }}
    uses: ArkanisCorporation/ci/.github/workflows/wf-deploy-k8s-aspire.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      runs-on: arkanis-runners
      runs-on-self-hosted: true
      aspire-environment: Kubernetes-Staging
      kubernetes-namespace: arkanis-overlay-staging
      apphost-project: src/Arkanis.Overlay.Host.Aspire/Arkanis.Overlay.Host.Aspire.csproj
      output-path: artifacts/k8s/staging
      image-tag: ${{ inputs.image-tag }}
      github-packages-auth: true
      environment-name: Staging
      global-json-file: global.json
      kubectl-version: v1.36.4

  deploy-production:
    if: ${{ inputs.target == 'production' }}
    uses: ArkanisCorporation/ci/.github/workflows/wf-deploy-k8s-aspire.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      runs-on: arkanis-runners
      runs-on-self-hosted: true
      aspire-environment: Kubernetes-Production
      kubernetes-namespace: arkanis-overlay-production
      apphost-project: src/Arkanis.Overlay.Host.Aspire/Arkanis.Overlay.Host.Aspire.csproj
      output-path: artifacts/k8s/production
      image-tag: ${{ inputs.image-tag }}
      github-packages-auth: true
      environment-name: Production
      global-json-file: global.json
      kubectl-version: v1.36.4
