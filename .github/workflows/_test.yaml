# Runs the .NET test suite through the shared Arkanis CI platform.
#
# Previously this hand-rolled actions/setup-dotnet@v6 with its built-in NuGet cache. .NET setup and
# caching are now delegated to ArkanisCorporation/ci's reusable wf-dotnet-test.yml, which routes
# setup through the platform setup-dotnet composite (SDK install, NuGet cache, local tool restore,
# locked restore, coverage report + one PR comment). Standardising on the platform is the point of
# Linear ARK-583 (epic ARK-579): hand-rolled setup-dotnet caching defeats the platform's
# persistent-NuGet cache skip on the self-hosted daedalus pool.
#
# Runner: pinned to windows-latest. The solution contains Windows-only projects
# (net10.0-windows10.0.17763.0 - the Desktop host and its unit tests), so the suite must build and
# run on Windows. windows-latest is GitHub-hosted, so runs-on-self-hosted is false and the
# persistent-NuGet cache skip (a daedalus self-hosted optimisation) simply does not apply here;
# the release-side jobs retain the self-hosted daedalus NuGet-cache optimization.

name: .NET Test

permissions: {}

on:
  workflow_call:
    secrets:
      NUGET_AUTH_JSON:
        required: false
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

jobs:
  test:
    name: Tests
    uses: ArkanisCorporation/ci/.github/workflows/wf-dotnet-test.yml@v1
    permissions:
      contents: read
      pull-requests: write  # for the coverage report PR comment
    with:
      runs-on: windows-latest
      runs-on-self-hosted: false
      global-json-file: global.json
      solution: ArkanisOverlay.sln
      test-filter: "DataState!=Live"
      timeout-minutes: 30
    secrets:
      NUGET_AUTH_JSON: ${{ secrets.NUGET_AUTH_JSON }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
